name: 功能建议
description: 新档位、新注入通道、配置项或文档改进
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先说清场景：它解决什么实际问题。写「某模型在某档位下仍不服从」比写「希望更灵活」有用得多。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在卡在哪里、哪个模型或哪类会话不达标
      placeholder: 例如：某模型对静态 section 服从弱，开了 per-turn 仍会漂回英文……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 配置项名、默认值、生效范围（静态 section / 每轮用户消息 / 设置页）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及面
      options:
        - 注入通道（injectPrompt / injectPerTurn）
        - 设置页交互
        - 档位与指令文本
        - 加载与兼容性
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 目前的变通做法
      description: 用了什么配置或临时改动，效果如何
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 环境
      description: '`dsh --version` 与 dsh-think-zh 版本'
      placeholder: dsh 0.1.7-rc.2 / dsh-think-zh 1.1.0
    validations:
      required: false
